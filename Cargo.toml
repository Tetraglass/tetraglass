[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# Public HTTPS URL derived from `git remote get-url origin` (bootstrap step 1).
repository = "https://github.com/Tetraglass/tetraglass"
# Raise to the MSRV of the egui release chosen in bootstrap step 5.
rust-version = "1.95"
# Flip to true per crate (or here) when preparing release 0.1.
publish = false

[workspace.dependencies]
# Internal crates (keep versions in sync with workspace.package.version).
tetraglass-core = { path = "crates/tetraglass-core", version = "0.0.0" }
tetraglass-io = { path = "crates/tetraglass-io", version = "0.0.0" }
tetraglass-filters = { path = "crates/tetraglass-filters", version = "0.0.0" }
tetraglass-scene = { path = "crates/tetraglass-scene", version = "0.0.0" }
tetraglass-render = { path = "crates/tetraglass-render", version = "0.0.0" }
tetraglass-egui = { path = "crates/tetraglass-egui", version = "0.0.0" }

# External crates: add each version once here, then use `name.workspace = true`.
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.37.0"
egui-wgpu = "0.37.0"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
log = "0.4"
quick-xml = "0.41"
thiserror = "2"
wgpu = "30.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Optimize dependencies in dev builds so filters and rendering stay usable while debugging.
[profile.dev.package."*"]
opt-level = 2
