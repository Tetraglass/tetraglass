[package]
name = "tetraglass-viewer"
description = "eframe desktop and web viewer application for Tetraglass scenes and meshes."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tetraglass-viewer"
readme = "../../README.md"
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "tetraglass-viewer"
path = "src/main.rs"

[lints]
